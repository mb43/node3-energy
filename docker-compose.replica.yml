version: "3.9"
services:
  node3-replica:
    build:
      context: .
      dockerfile: Dockerfile.replica
    container_name: node3-replica
    ports:
      - "8586:8585"   # host 8586 -> container 8585 (change if you prefer 8585)
    volumes:
      - ./data:/app/data:ro   # read‑only mount to protect live data
    environment:
      - AGILE_REGION=H
      # Add any additional env vars here
    restart: unless‑stopped
