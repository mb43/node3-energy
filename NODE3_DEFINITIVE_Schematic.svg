<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" font-family="Inter, Arial, sans-serif" font-size="12">
  <style>
    .hv { stroke: #d40000; stroke-width: 3; fill: none; }
    .hv-dashed { stroke: #d40000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .lv { stroke: #0066cc; stroke-width: 2; fill: none; }
    .can { stroke: #009933; stroke-width: 2; fill: none; }
    .gnd { stroke: #555; stroke-width: 2; fill: none; }
    .box { fill: #ffffff; stroke: #000; stroke-width: 1.5; }
    .pack { fill: #fff3d6; stroke: #b08800; stroke-width: 2; }
    .ssr { fill: #f0f0ff; stroke: #4444aa; stroke-width: 1.5; }
    .breaker { fill: #ffe0e0; stroke: #aa0000; stroke-width: 1.5; }
    .estop { fill: #ff0000; stroke: #800000; stroke-width: 2; }
    .lbl { font-size: 11px; fill: #222; }
    .ttl { font-size: 14px; font-weight: 700; fill: #000; }
    .small { font-size: 9px; fill: #555; }
    .legend { font-size: 11px; fill: #222; }
  </style>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="ttl">NODE-3 Definitive Schematic — 3× Nissan e-NV200 || FoxESS KH10.5 (DALA single-BMS read mode)</text>
  <text x="600" y="50" text-anchor="middle" class="small">30 May 2026 · Pack-internal contactors + SSR drive · No Albright · OEM Sumitomo HV plugs</text>

  <!-- Legend -->
  <g transform="translate(20, 70)">
    <line x1="0" y1="0" x2="30" y2="0" class="hv"/>
    <text x="35" y="4" class="legend">HV DC (~360 V)</text>
    <line x1="160" y1="0" x2="190" y2="0" class="lv"/>
    <text x="195" y="4" class="legend">12 V LV</text>
    <line x1="260" y1="0" x2="290" y2="0" class="can"/>
    <text x="295" y="4" class="legend">CAN bus</text>
    <line x1="380" y1="0" x2="410" y2="0" class="gnd"/>
    <text x="415" y="4" class="legend">GND / 0V</text>
    <line x1="490" y1="0" x2="520" y2="0" class="hv-dashed"/>
    <text x="525" y="4" class="legend">Pack-internal HV (after SDP)</text>
  </g>

  <!-- Inverter -->
  <rect x="500" y="100" width="200" height="80" class="box"/>
  <text x="600" y="130" text-anchor="middle" class="ttl">FoxESS KH10.5</text>
  <text x="600" y="148" text-anchor="middle" class="lbl">HV Hybrid Inverter</text>
  <text x="600" y="164" text-anchor="middle" class="small">10.5 kW · single-phase 230 V · G99 ROCOF + VS</text>

  <!-- Master breaker -->
  <rect x="540" y="220" width="120" height="50" class="breaker"/>
  <text x="600" y="240" text-anchor="middle" class="lbl" font-weight="700">TOMZN DC 2P</text>
  <text x="600" y="256" text-anchor="middle" class="small">1100 V 32 A — MASTER isolator</text>

  <!-- HV from inverter to master -->
  <line x1="600" y1="180" x2="600" y2="220" class="hv"/>

  <!-- Busbar -->
  <rect x="200" y="310" width="800" height="20" fill="#ffd5d5" stroke="#aa0000" stroke-width="2"/>
  <text x="600" y="324" text-anchor="middle" class="lbl" font-weight="700">+/− Busbars (tinned Cu 6×30 mm × 200 mm on insulated standoffs)</text>

  <!-- HV master breaker to busbar -->
  <line x1="600" y1="270" x2="600" y2="310" class="hv"/>

  <!-- Three branch breakers -->
  <g>
    <rect x="240" y="370" width="100" height="50" class="breaker"/>
    <text x="290" y="390" text-anchor="middle" class="lbl" font-weight="700">TOMZN 2P</text>
    <text x="290" y="406" text-anchor="middle" class="small">Branch Pack 1</text>
    <line x1="290" y1="330" x2="290" y2="370" class="hv"/>

    <rect x="540" y="370" width="100" height="50" class="breaker"/>
    <text x="590" y="390" text-anchor="middle" class="lbl" font-weight="700">TOMZN 2P</text>
    <text x="590" y="406" text-anchor="middle" class="small">Branch Pack 2</text>
    <line x1="590" y1="330" x2="590" y2="370" class="hv"/>

    <rect x="840" y="370" width="100" height="50" class="breaker"/>
    <text x="890" y="390" text-anchor="middle" class="lbl" font-weight="700">TOMZN 2P</text>
    <text x="890" y="406" text-anchor="middle" class="small">Branch Pack 3</text>
    <line x1="890" y1="330" x2="890" y2="370" class="hv"/>
  </g>

  <!-- Sumitomo plugs (3) -->
  <g>
    <rect x="255" y="450" width="70" height="30" fill="#ffe5b3" stroke="#996600"/>
    <text x="290" y="470" text-anchor="middle" class="small">Sumitomo HV plug</text>
    <line x1="290" y1="420" x2="290" y2="450" class="hv"/>

    <rect x="555" y="450" width="70" height="30" fill="#ffe5b3" stroke="#996600"/>
    <text x="590" y="470" text-anchor="middle" class="small">Sumitomo HV plug</text>
    <line x1="590" y1="420" x2="590" y2="450" class="hv"/>

    <rect x="855" y="450" width="70" height="30" fill="#ffe5b3" stroke="#996600"/>
    <text x="890" y="470" text-anchor="middle" class="small">Sumitomo HV plug</text>
    <line x1="890" y1="420" x2="890" y2="450" class="hv"/>
  </g>

  <!-- SDPs (3) -->
  <g>
    <rect x="265" y="500" width="50" height="20" fill="#ffd700" stroke="#806000" stroke-width="2"/>
    <text x="290" y="514" text-anchor="middle" class="small">SDP 1</text>
    <line x1="290" y1="480" x2="290" y2="500" class="hv"/>

    <rect x="565" y="500" width="50" height="20" fill="#ffd700" stroke="#806000" stroke-width="2"/>
    <text x="590" y="514" text-anchor="middle" class="small">SDP 2</text>
    <line x1="590" y1="480" x2="590" y2="500" class="hv"/>

    <rect x="865" y="500" width="50" height="20" fill="#ffd700" stroke="#806000" stroke-width="2"/>
    <text x="890" y="514" text-anchor="middle" class="small">SDP 3</text>
    <line x1="890" y1="480" x2="890" y2="500" class="hv"/>
  </g>

  <!-- 3 packs -->
  <g>
    <rect x="200" y="540" width="180" height="130" class="pack"/>
    <text x="290" y="565" text-anchor="middle" class="ttl">PACK 1</text>
    <text x="290" y="585" text-anchor="middle" class="lbl">Nissan e-NV200 24 kWh</text>
    <text x="290" y="603" text-anchor="middle" class="small">Internal BMS</text>
    <text x="290" y="617" text-anchor="middle" class="small">Internal precharge resistor</text>
    <text x="290" y="631" text-anchor="middle" class="small">Internal +/− main contactors</text>
    <text x="290" y="648" text-anchor="middle" class="small" fill="#009933">CAN to LilyGo (only Pack 1)</text>
    <text x="290" y="662" text-anchor="middle" class="small">Yazaki 36-pin</text>

    <rect x="500" y="540" width="180" height="130" class="pack"/>
    <text x="590" y="565" text-anchor="middle" class="ttl">PACK 2</text>
    <text x="590" y="585" text-anchor="middle" class="lbl">Nissan e-NV200 24 kWh</text>
    <text x="590" y="603" text-anchor="middle" class="small">Internal BMS</text>
    <text x="590" y="617" text-anchor="middle" class="small">Internal precharge resistor</text>
    <text x="590" y="631" text-anchor="middle" class="small">Internal +/− main contactors</text>
    <text x="590" y="648" text-anchor="middle" class="small">CAN H/L not connected</text>
    <text x="590" y="662" text-anchor="middle" class="small">Yazaki 36-pin</text>

    <rect x="800" y="540" width="180" height="130" class="pack"/>
    <text x="890" y="565" text-anchor="middle" class="ttl">PACK 3</text>
    <text x="890" y="585" text-anchor="middle" class="lbl">Nissan e-NV200 24 kWh</text>
    <text x="890" y="603" text-anchor="middle" class="small">Internal BMS</text>
    <text x="890" y="617" text-anchor="middle" class="small">Internal precharge resistor</text>
    <text x="890" y="631" text-anchor="middle" class="small">Internal +/− main contactors</text>
    <text x="890" y="648" text-anchor="middle" class="small">CAN H/L not connected</text>
    <text x="890" y="662" text-anchor="middle" class="small">Yazaki 36-pin</text>
  </g>

  <line x1="290" y1="520" x2="290" y2="540" class="hv-dashed"/>
  <line x1="590" y1="520" x2="590" y2="540" class="hv-dashed"/>
  <line x1="890" y1="520" x2="890" y2="540" class="hv-dashed"/>

  <!-- Yazaki harness bus (daisy chain) -->
  <line x1="200" y1="720" x2="980" y2="720" class="lv"/>
  <line x1="290" y1="670" x2="290" y2="720" class="lv"/>
  <line x1="590" y1="670" x2="590" y2="720" class="lv"/>
  <line x1="890" y1="670" x2="890" y2="720" class="lv"/>
  <text x="600" y="735" text-anchor="middle" class="small" fill="#0066cc">LV daisy chain — Pin 1 (BAT+IGN 12V), Pin 2 (GND), Precharge coil, +Cont coil, −Cont coil — same wires to all 3 Yazakis</text>

  <!-- CAN A from Pack 1 to LilyGo -->
  <path d="M 290 670 Q 130 670 130 800" class="can"/>
  <text x="155" y="700" class="small" fill="#009933">CAN-A (Pack 1 BMS)</text>

  <!-- LilyGo + Waveshare + control -->
  <rect x="60" y="800" width="200" height="100" class="box"/>
  <text x="160" y="820" text-anchor="middle" class="ttl">LilyGo T-2CAN ESP32-S3</text>
  <text x="160" y="836" text-anchor="middle" class="small">DALA firmware — "Nissan LEAF 3P" mode</text>
  <text x="160" y="852" text-anchor="middle" class="small">CAN-A → Pack 1 BMS  ·  CAN-B → FoxESS (isol.)</text>
  <text x="160" y="868" text-anchor="middle" class="small">GPIO 25 → SSR1   GPIO 32 → SSR2   GPIO 33 → SSR3</text>
  <text x="160" y="884" text-anchor="middle" class="small">Reports 3× capacity to FoxESS</text>

  <!-- Waveshare isolated CAN HAT -->
  <rect x="320" y="800" width="160" height="60" class="box"/>
  <text x="400" y="820" text-anchor="middle" class="lbl" font-weight="700">Waveshare 2-CH</text>
  <text x="400" y="836" text-anchor="middle" class="small">Isolated CAN HAT</text>
  <text x="400" y="852" text-anchor="middle" class="small">(galvanic isolation to FoxESS)</text>

  <!-- LilyGo to Waveshare -->
  <line x1="260" y1="830" x2="320" y2="830" class="can"/>
  <text x="290" y="822" text-anchor="middle" class="small" fill="#009933">CAN-B</text>

  <!-- Waveshare to FoxESS CAN -->
  <path d="M 480 830 Q 700 830 700 180" class="can"/>
  <text x="495" y="824" class="small" fill="#009933">CAN to FoxESS BMS port</text>

  <!-- SSR-04 -->
  <rect x="540" y="800" width="200" height="100" class="ssr"/>
  <text x="640" y="820" text-anchor="middle" class="ttl">SSR-04 (4-ch SSR)</text>
  <text x="640" y="838" text-anchor="middle" class="small">Ch1 OUT → Precharge coil bus</text>
  <text x="640" y="852" text-anchor="middle" class="small">Ch2 OUT → +Contactor coil bus</text>
  <text x="640" y="866" text-anchor="middle" class="small">Ch3 OUT → −Contactor coil bus</text>
  <text x="640" y="880" text-anchor="middle" class="small">Ch4 = SPARE</text>

  <!-- LilyGo to SSR IN -->
  <path d="M 260 880 Q 400 920 540 870" class="lv"/>
  <text x="370" y="918" text-anchor="middle" class="small" fill="#0066cc">3.3V GPIO 25/32/33 + GND</text>

  <!-- SSR OUT to Yazaki daisy bus -->
  <path d="M 640 800 Q 640 750 700 720" class="lv"/>
  <text x="660" y="770" class="small" fill="#0066cc">12V switched to coil bus</text>

  <!-- 12V PSU and E-stop -->
  <rect x="800" y="800" width="160" height="100" class="box"/>
  <text x="880" y="820" text-anchor="middle" class="ttl">Mean Well DR-60-12</text>
  <text x="880" y="836" text-anchor="middle" class="small">230 V AC → 12 V DC, 5 A, DIN-rail</text>
  <text x="880" y="852" text-anchor="middle" class="small">Powers all LV (Yazaki Pin 1, SSR OUT,</text>
  <text x="880" y="866" text-anchor="middle" class="small">DROK→5V for LilyGo, RPi, etc.)</text>

  <!-- AC mains in -->
  <line x1="880" y1="900" x2="880" y2="940" class="gnd"/>
  <text x="880" y="958" text-anchor="middle" class="small">230 V AC mains (M25 gland)</text>

  <!-- E-stop -->
  <circle cx="1020" cy="850" r="25" class="estop"/>
  <text x="1020" y="855" text-anchor="middle" fill="white" font-weight="700" font-size="10">E-STOP</text>
  <text x="1020" y="895" text-anchor="middle" class="small">NC contact</text>
  <text x="1020" y="908" text-anchor="middle" class="small">in series with</text>
  <text x="1020" y="921" text-anchor="middle" class="small">Pin 1 12V feed</text>

  <!-- PSU to E-stop -->
  <path d="M 960 840 L 995 840" class="lv"/>
  <!-- E-stop to LV bus -->
  <path d="M 1020 875 Q 1020 720 980 720" class="lv"/>

  <!-- Earth bonding -->
  <line x1="100" y1="1010" x2="1100" y2="1010" class="gnd"/>
  <text x="600" y="1030" text-anchor="middle" class="small">PE earth busbar (Phoenix USLKG 6) — bonds: pack chassis × 3, enclosure body, inverter chassis, mains earth</text>
  <path d="M 290 670 Q 290 990 290 1010" class="gnd"/>
  <path d="M 590 670 Q 590 990 590 1010" class="gnd"/>
  <path d="M 890 670 Q 890 990 890 1010" class="gnd"/>
  <path d="M 600 180 Q 1100 180 1100 1010" class="gnd"/>

  <!-- Notes box -->
  <rect x="20" y="970" width="350" height="80" fill="#fffbe0" stroke="#aa8800" stroke-width="1"/>
  <text x="30" y="988" class="small" font-weight="700">Key invariants:</text>
  <text x="30" y="1002" class="small">• Albright NOT present — pack-internal contactors do the work.</text>
  <text x="30" y="1014" class="small">• Only Pack 1 carries CAN. Packs 2/3 are slaves on Pin 1 + coils.</text>
  <text x="30" y="1026" class="small">• E-stop drops Pin 1 → all 3 packs open in ~100 ms.</text>
  <text x="30" y="1038" class="small">• Exact Yazaki coil pin numbers: see DALA wiki diagram.</text>
</svg>
