services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: node3-mosquitto
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf
    restart: unless-stopped
  node3:
    depends_on:
      - mosquitto
    build: .
    container_name: node3-portal
    ports:
      - "8585:8585"
    volumes:
      # Persist fleet state and history across container restarts
      - ./fleet_state.json:/app/fleet_state.json
      - ./history.csv:/app/history.csv
      - ./prices.json:/app/prices.json
      # Persist operator-configurable settings (battery/import/export/min-SOC)
      # across restarts — without this bind mount, any settings saved via the
      # dashboard's SETTINGS panel would vanish on every --force-recreate,
      # since node3_config.json would only exist inside the ephemeral
      # container filesystem.
      - ./node3_config.json:/app/node3_config.json
      # Live-mount source files — edits take effect without rebuild
      - ./dashboard.html:/app/dashboard.html
      - ./index.html:/app/index.html
      - ./simulate.py:/app/simulate.py
      - ./server.py:/app/server.py
      - ./node3_config.py:/app/node3_config.py
      - ./hardware_bridge.py:/app/hardware_bridge.py
      - ./node3_mode.json:/app/node3_mode.json
      - ./NODE3_Schematic.html:/app/NODE3_Schematic.html
      # Schematic diagram assets — NOT baked into the image (Dockerfile only
      # COPYs server.py/simulate.py/dashboard.html/index.html) and were never
      # mounted here either, so the SCHEMATIC tab's images always 404'd
      # inside the container even though the files sit right there on disk.
      # Must match server.py's _SAFE_ASSETS whitelist exactly.
      - ./NODE3_DEFINITIVE_Schematic.svg:/app/NODE3_DEFINITIVE_Schematic.svg
      - ./NODE3_LV_Wiring_Schematic.svg:/app/NODE3_LV_Wiring_Schematic.svg
      - ./NODE3_DEFINITIVE_BoxLayout.svg:/app/NODE3_DEFINITIVE_BoxLayout.svg
      - ./NODE3_G99_SLD_DSL-SLD-001_RevA_preview.png:/app/NODE3_G99_SLD_DSL-SLD-001_RevA_preview.png
    #devices:
     # - /dev/ttyUSB1:/dev/ttyUSB1
    environment:
      - NODE3_API_KEY=${NODE3_API_KEY:-}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - PYTHONUNBUFFERED=1
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=node3/cmd
      - BATTERY_EMULATOR_MQTT_TOPIC=battery-emulator
      - FOXESS_API_KEY=${FOXESS_API_KEY:-}
      - FOXESS_DEVICE_SN=${FOXESS_DEVICE_SN:-}
      - FOXESS_MODBUS_HOST=${FOXESS_MODBUS_HOST:-}
      - FOXESS_RS485_PORT=/dev/ttyUSB1
      - FOXESS_RS485_BAUD=9600
      - FOXESS_MODBUS_ADDR=247
      - NODE3_MODE=${NODE3_MODE:-}
      - NODE3_G99_ACTIVE=${NODE3_G99_ACTIVE:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8585/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
